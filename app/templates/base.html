<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Računi{% endblock %} · RačunTracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('bills.index') }}">RačunTracker</a>
    {% if session.logged_in %}
    <nav>
      <a href="{{ url_for('settings.index') }}">Podešavanja</a>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="link">Odjava</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="flash {{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

{% extends "base.html" %}
{% block title %}Prijava{% endblock %}
{% block content %}
<form class="card login" method="post">
  <h1>Prijava</h1>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Lozinka <input type="password" name="password" autocomplete="current-password" required autofocus></label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button class="primary">Prijavi se</button>
</form>
{% endblock %}
